<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <h1 class="title">Landing Page</h1>

        <a href="/rezepte/neu" class="button is-primary mb-5">+ Neues Rezept</a>

        {% if rezepte %}
            <div class="columns is-multiline">
                {% for rezept in rezepte %}
                <div class="column is-one-third">
                    <a href="/rezepte/{{ rezept.id }}" class="box">
                        <h2 class="subtitle">{{ rezept.title }}</h2>
                        <p>{{ rezept.portionen }} · {{ rezept.zubereitungszeit }}</p>
                    </a>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p>Noch keine Rezepte angelegt.</p>
        {% endif %}
    </section>
</body>
</html>
