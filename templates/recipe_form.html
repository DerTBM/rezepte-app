<!-- Form zum Anlegen eines neuen Rezepts -->
{% extends "base.html" %}

{% block title %}Neues Rezept{% endblock %}

{% block content %}
    <!-- Topbar mit Zurück-Link -->
    <nav class="recipe-topbar">
        <a href="/" class="topbar-back">← Zurück</a>
    </nav>

    <!-- Form-Karte: gleicher Look wie die Rezept-Detail-Karte -->
    <article class="recipe-card">

        <!-- Hero-Banner mit Theme-Farbe (passt sich live an Dropdown-Auswahl an, später) -->
        <header class="recipe-hero">
            <h1 class="recipe-title">Neues Rezept</h1>
        </header>

        <div class="recipe-body">
            <!-- enctype="multipart/form-data" ist Pflicht für File-Upload -->
            <form method="post" action="/rezepte/neu" enctype="multipart/form-data" class="rezept-form">

                <!-- Meta-Block: Titel, Portionen, Zubereitungszeit, Theme -->
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-field form-field-expand">
                            <label class="form-label">Titel</label>
                            <input class="form-input" type="text" name="title" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Portionen</label>
                            <input class="form-input" type="number" name="portionen" value="2" min="1" required>
                        </div>
                        <div class="form-field form-field-expand">
                            <label class="form-label">Zubereitungszeit</label>
                            <input class="form-input" type="text" name="zubereitungszeit" placeholder="z.B. 40 Minuten">
                        </div>
                        <div class="form-field">
                            <label class="form-label">Kalorien (kcal)</label>
                            <input class="form-input" type="number" name="Kalorien" min="0" placeholder="optional">
                        </div>
                        <div class="form-field">
                            <label class="form-label">Theme</label>
                            <div class="form-select-wrapper">
                                <!-- onchange triggert den Live-Theme-Switch. 
                                 data-farbe an jeder Option, damit JS die Farbe kennt -->
                                 <select class="form-select" name="theme" onchange="wechsleTheme(this)">
                                    {% for t in themes %}
                                    <option value="{{ t.name }}" data-farbe="{{ t.farbe }}">{{ t.name }}</option>
                                    {% endfor %}
                                 </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bild-Upload -->
                <div class="form-section">
                    <label class="form-section-label">Bild</label>
                    <div class="form-field">
                        <input class="form-input" type="file" name="bild" accept="image/*">
                    </div>
                </div>

                <!-- Kategorien als Pillen-Checkboxen -->
                <div class="form-section">
                    <label class="form-section-label">Kategorien</label>
                    <div class="kategorien-checkboxes">
                        {% for kat in kategorien %}
                        <label class="kategorie-checkbox" style="--kat-color: {{ kat.farbe }};">
                            <input type="checkbox" name="kategorien" value="{{ kat.name }}">
                            <span>{{ kat.name }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Zutaten -->
                <div class="form-section">
                    <h2 class="section-headline">Zutaten</h2>
                    <div id="zutaten-container" class="form-rows-container">
                        <!-- Wird per JavaScript befüllt -->
                    </div>
                    <button type="button" class="form-add-button" onclick="addZutat()">+ Zutat hinzufügen</button>
                </div>

                <!-- Zubereitungsschritte -->
                <div class="form-section">
                    <h2 class="section-headline">Zubereitungsschritte</h2>
                    <div id="schritte-container" class="form-rows-container">
                        <!-- Wird per JavaScript befüllt -->
                    </div>
                    <button type="button" class="form-add-button" onclick="addSchritt()">+ Schritt hinzufügen</button>
                </div>

                <!-- Action-Bar wird per CSS sticky am unteren Rand fixiert -->
                <div class="form-action-bar">
                    <a href="/" class="action-button action-button-cancel">Abbrechen</a>
                    <button type="submit" class="action-button action-button-primary">Speichern</button>
                </div>
            </form>
        </div>
    </article>
{% endblock %}

{% block scripts %}
    <!-- SortableJS von CDN - macht die Zutaten-/Schritt-Container per Drag sortierbar -->
    <script src="/static/js/Sortable.min.js"></script>
    <script src="/static/js/recipe_form.js"></script>
    <script>
        // Beim Laden: eine leere Zeile pro Bereich
        addZutat();
        addSchritt();
        // Drag-and-Drop für beide Container aktivieren
        initSortable();
    </script>
{% endblock %}
